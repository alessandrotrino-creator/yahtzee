<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Segnapunti Yahtzee</title>
<style>
:root{
  --bg:#f3eee4; --surface:#fffdf8; --surface-2:#f7f1e6; --ink:#2a2620; --muted:#786f62; --line:#e3d9c8;
  --accent:#1e6b51; --accent-soft:#dcefe6; --accent-ink:#fff;
  --gold:#a87a06; --gold-soft:#fbefd0; --danger:#b23b25; --danger-soft:#f8e0da;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 6px 20px rgba(40,30,10,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14130f; --surface:#1e1c17; --surface-2:#26231d; --ink:#efe9dd; --muted:#a69e90; --line:#39352d;
    --accent:#4cb68b; --accent-soft:#1d3a2f; --accent-ink:#0d1a14;
    --gold:#e2b84a; --gold-soft:#3a3018; --danger:#ef7a62; --danger-soft:#43221b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14130f; --surface:#1e1c17; --surface-2:#26231d; --ink:#efe9dd; --muted:#a69e90; --line:#39352d;
  --accent:#4cb68b; --accent-soft:#1d3a2f; --accent-ink:#0d1a14;
  --gold:#e2b84a; --gold-soft:#3a3018; --danger:#ef7a62; --danger-soft:#43221b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 48px}

header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.head{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em;margin-right:auto}
nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav button{border:0;background:none;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:600;white-space:nowrap}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
nav button:hover:not([aria-current="true"]){background:var(--surface-2);color:var(--ink)}

h2{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-top:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.empty-state{text-align:center;padding:36px 16px;color:var(--muted)}
.empty-state .big{font-size:40px;margin-bottom:6px}

/* scelta giocatori */
.pick{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 18px}
.chip{position:relative;display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px 6px 6px;font-weight:600;min-height:44px}
.chip .av{width:32px;height:32px}
.chip.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,var(--surface))}
.chip .ord{position:absolute;top:-8px;right:-6px;background:var(--pc);color:#fff;font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--surface)}
.av{display:inline-grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--pc) 22%,var(--surface));border:2px solid var(--pc);font-size:18px;width:36px;height:36px;flex:none;line-height:1}

/* barra partita */
.gamebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 12px}
.turn{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 16px 5px 5px;box-shadow:var(--shadow)}
.turn .lbl{font-size:12px;color:var(--muted);line-height:1.1}
.turn b{display:block;font-size:15px}
.gamebar .spacer{flex:1}

/* cartella */
.sheet-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
table.sheet{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
.sheet th,.sheet td{border-bottom:1px solid var(--line);padding:0;text-align:center}
.sheet thead th{padding:12px 6px 10px;vertical-align:bottom;min-width:92px;border-bottom:2px solid var(--line)}
.sheet thead th .av{width:38px;height:38px;font-size:20px;margin-bottom:4px}
.sheet thead th .nm{display:block;font-weight:700;max-width:120px;margin:0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet thead th.now{background:color-mix(in srgb,var(--pc) 10%,var(--surface))}
.sheet thead th .tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--pc);border-radius:999px;padding:1px 8px;margin-top:3px}
.sheet .lab{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:8px 12px;min-width:170px;border-right:1px solid var(--line)}
.sheet .lab .t{font-weight:600;display:flex;align-items:center;gap:8px}
.sheet .lab .h{font-size:12px;color:var(--muted);display:block;line-height:1.25}
.sheet tr.sec th{background:var(--surface-2);text-align:left;padding:6px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);position:sticky;left:0}
.sheet tr.tot td,.sheet tr.tot .lab{background:var(--surface-2);font-weight:700}
.sheet tr.grand td,.sheet tr.grand .lab{background:var(--ink);color:var(--bg);font-size:18px;font-weight:800;border-bottom:0}
.sheet tr.grand .lab .h{color:inherit;opacity:.7}
.sheet td.now{background:color-mix(in srgb,var(--pc) 7%,transparent)}
.cell{width:100%;min-height:46px;border:0;background:none;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;padding:4px}
.cell:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.cell.empty{color:var(--line);font-weight:400}
.cell.empty::after{content:"+";font-size:20px;color:var(--muted);opacity:.35}
.cell.empty:hover::after{opacity:1;color:var(--accent)}
.cell.zero{color:var(--muted);font-weight:500;text-decoration:line-through;text-decoration-color:var(--danger);text-decoration-thickness:2px}
.cell.flash{animation:flash .9s ease}
@keyframes flash{0%{background:var(--gold-soft)}100%{background:transparent}}
.mini{font-size:12px;font-weight:600;color:var(--muted);display:block}
.ok{color:var(--accent)}
.crown{font-size:14px}
.bonuscell{font-size:16px}
.tip{color:var(--muted);font-size:13px;margin:10px 2px 0}

/* dialog */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(20,16,10,.45);backdrop-filter:blur(2px)}
.dlg-h{padding:18px 20px 6px;display:flex;gap:12px;align-items:center}
.dlg-h .ttl{font-weight:800;font-size:18px;line-height:1.2}
.dlg-h .hh{color:var(--muted);font-size:13px}
.dlg-b{padding:10px 20px 6px}
.dlg-f{padding:12px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-f .left{margin-right:auto}
.modes{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.modes button{border:0;background:none;padding:8px 4px;border-radius:9px;font-weight:600;color:var(--muted);font-size:13px}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.opts.big{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:48px;font-size:18px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.opt small{font-size:11px;font-weight:600;color:var(--muted)}
.opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.opt.zero{color:var(--danger)}
.opt.zero:hover{border-color:var(--danger);background:var(--danger-soft)}
.opt.sel{outline:3px solid var(--accent);outline-offset:1px}
.extra{display:flex;gap:8px;align-items:center;background:var(--gold-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:600;font-size:14px;cursor:pointer}
.extra input{width:18px;height:18px;accent-color:var(--gold)}
.slots{display:flex;gap:8px;justify-content:center;margin:4px 0 14px}
.slot{width:56px;height:56px;border-radius:12px;border:2px dashed var(--line);background:none;display:grid;place-items:center;padding:0}
.slot.full{border:0}
.pad{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pad button{border:0;background:none;padding:2px;border-radius:10px}
.pad button:hover{background:var(--surface-2)}
.die rect{fill:var(--surface);stroke:var(--ink);stroke-width:6}
.die circle{fill:var(--ink)}
.slot .die rect{fill:var(--gold-soft)}
.preview{margin-top:16px;text-align:center;background:var(--surface-2);border-radius:12px;padding:12px}
.preview .v{font-size:32px;font-weight:800;line-height:1}
.warn{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;margin-top:10px}
.note{background:var(--gold-soft);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;margin-top:10px}
.manual{display:flex;gap:10px;align-items:center}
.manual input{flex:1;font-size:28px;font-weight:800;padding:8px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);width:100%;min-width:0}
.manual input:focus{outline:none;border-color:var(--accent)}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0}
.stepper .n{font-size:36px;font-weight:800;min-width:60px;text-align:center}
.stepper .btn{width:52px;height:52px;justify-content:center;font-size:24px;border-radius:50%}

/* giocatori */
.form{display:grid;gap:14px}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.field input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.field input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.emojis,.colors{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;padding:0}
.emojis button[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid var(--surface);background:var(--c);box-shadow:0 0 0 1px var(--line);padding:0}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:4px}
.pcard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:12px;padding:12px;background:var(--surface)}
.pcard .info{flex:1;min-width:0}
.pcard .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .info span{font-size:12px;color:var(--muted)}
.pcard .acts{display:flex;gap:4px}
.icon-btn{border:0;background:none;width:34px;height:34px;border-radius:8px;font-size:16px}
.icon-btn:hover{background:var(--surface-2)}

/* storico / record */
.hist{display:grid;gap:12px}
.hcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}
.hcard .top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.hcard .date{font-weight:700}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.badge.warn2{background:var(--danger-soft);color:var(--danger)}
.rank{display:flex;flex-wrap:wrap;gap:8px}
.rank .r{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:3px 12px 3px 3px;font-size:14px}
.rank .r .av{width:26px;height:26px;font-size:14px}
.rank .r b{font-variant-numeric:tabular-nums}
.rank .r.win{background:var(--gold-soft)}
.records{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.records{grid-template-columns:1fr}}
.rec{border-radius:16px;padding:18px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.rec.hi{background:linear-gradient(135deg,var(--gold-soft),var(--surface) 70%)}
.rec .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
.rec .v{font-size:44px;font-weight:800;line-height:1.05;margin:6px 0 8px;font-variant-numeric:tabular-nums}
.rec .who{display:flex;align-items:center;gap:8px;font-weight:600}
.rec .who span{color:var(--muted);font-weight:400;font-size:13px}
.tbl-wrap{overflow-x:auto}
table.stats{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
.stats th,.stats td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.stats th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.stats th:first-child,.stats td:first-child{text-align:left}
.stats td:first-child{display:flex;align-items:center;gap:8px;font-weight:600}
.stats td:first-child .av{width:28px;height:28px;font-size:15px}
.final-list{display:grid;gap:8px}
.final-list .f{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.final-list .f.win{background:var(--gold-soft)}
.final-list .f .pos{font-size:22px;width:30px;text-align:center}
.final-list .f .n{flex:1;font-weight:700}
.final-list .f .s{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.newrec{display:inline-block;margin-left:6px;font-size:11px;background:var(--gold);color:#fff;border-radius:999px;padding:1px 8px;vertical-align:middle}
.rules{columns:2 320px;column-gap:28px}
.rules section{break-inside:avoid;margin-bottom:18px}
.rules table{width:100%;border-collapse:collapse;font-size:14px}
.rules td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.rules td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.rules p,.rules li{font-size:14px}

.hbtns{display:flex;gap:6px}
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:16px;padding:14px 18px;margin-top:20px}
.banner .txt{flex:1;min-width:200px}
.banner .txt b{display:block}
.banner .txt span{font-size:13px;color:var(--muted)}
.modepick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 18px}
@media (max-width:560px){.modepick{grid-template-columns:1fr}}
.modepick button{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px}
.modepick button b{display:block;font-size:15px}
.modepick button span{font-size:13px;color:var(--muted)}
.modepick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tray{margin-top:0;display:flex;flex-direction:column;align-items:center;gap:14px;background:radial-gradient(ellipse at top,color-mix(in srgb,var(--accent) 22%,var(--surface)),color-mix(in srgb,var(--accent) 8%,var(--surface)))}
.vdice{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.vd{border:0;background:none;padding:4px;border-radius:16px;position:relative;transition:transform .15s}
.vd .q{display:grid;place-items:center;width:64px;height:64px;border:3px dashed var(--line);border-radius:14px;font-size:24px;color:var(--muted)}
.vd.held{transform:translateY(-6px)}
.vd.held .die rect{fill:var(--gold-soft);stroke:var(--gold)}
.vd.held::after{content:"tenuto";position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--gold)}
.vd.spin svg{animation:spin .45s ease-out}
@keyframes spin{0%{transform:rotate(-200deg) scale(.6);opacity:.3}100%{transform:none;opacity:1}}
.btn.big{font-size:17px;padding:12px 26px;min-height:50px;border-radius:14px}
.trayinfo{font-size:13px;color:var(--muted);text-align:center}
.pv{font-size:16px;font-weight:700;color:var(--accent);opacity:.85;border:1.5px dashed var(--accent);border-radius:8px;padding:0 8px}
.cell.pvcell::after{content:none}
.cell.locked{cursor:default}
.cell.locked:hover{background:none}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;margin-top:8px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-variant-numeric:tabular-nums}
.bar .track{width:100%;max-width:46px;height:90px;background:var(--surface-2);border-radius:8px;position:relative;overflow:hidden}
.bar .fill{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:8px 8px 0 0}
.bar .exp{position:absolute;left:-2px;right:-2px;border-top:2px dashed var(--gold)}
details.sum{margin-top:14px}
details.sum summary{cursor:pointer;font-weight:600;color:var(--muted)}
/* impostazioni */
.set{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .st{flex:1;min-width:0}
.set .st b{display:block;font-size:15px}
.set .st span{font-size:12px;color:var(--muted)}
.switch{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.switch:checked{background:var(--accent)}
.switch:checked::after{left:21px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px;flex:none}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hb.due{position:relative}
.hb.due::after{content:"";position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--danger);border:2px solid var(--bg)}
.banner.alert{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.again{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px dashed var(--accent);background:var(--accent-soft);border-radius:14px;padding:10px 14px;margin-bottom:16px}
.again .avs{display:flex}
.again .avs .av{width:28px;height:28px;font-size:15px;margin-right:-6px}
.again b{display:block}
.again span.s{font-size:12px;color:var(--muted)}

/* annuncio del turno */
#turnov{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:color-mix(in srgb,var(--pc,#000) 25%,rgba(10,8,5,.5));opacity:0;pointer-events:none;transition:opacity .25s;cursor:pointer}
#turnov.show{opacity:1;pointer-events:auto}
#turnov .box{background:var(--surface);border-radius:26px;padding:26px 44px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);transform:scale(.85);transition:transform .35s cubic-bezier(.2,1.5,.4,1);border-top:8px solid var(--pc)}
#turnov.show .box{transform:none}
#turnov .av{width:88px;height:88px;font-size:48px;border-width:4px}
#turnov .k{color:var(--muted);font-weight:600;margin-top:10px}
#turnov .n{font-size:36px;font-weight:800;line-height:1.1}
#turnov .s{font-size:13px;color:var(--muted);margin-top:6px}

/* consiglio */
.hintbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px}
.hintbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.hintbox .die{vertical-align:middle;margin:0 1px}
.vd.sugg::before{content:"";position:absolute;inset:-3px;border:3px dashed var(--accent);border-radius:19px}
.cell.sugg{box-shadow:inset 0 0 0 3px var(--accent)}

/* cartella compatta (telefono) */
.ptabs{display:none}
.ptab{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;font-weight:600;font-size:13px;white-space:nowrap;flex:none}
.ptab .av{width:26px;height:26px;font-size:14px}
.ptab b{font-variant-numeric:tabular-nums;color:var(--muted)}
.ptab[aria-pressed="true"]{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,var(--surface))}
.ptab[aria-pressed="true"] b{color:var(--ink)}
.ptab .dot{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.swipehint{display:none}
.ni{display:none}

/* modalità storia */
.progress{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:6px 0 4px}
.progress div{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width .4s}
.path{position:relative;display:grid;gap:14px;margin-top:20px;padding-left:28px}
.path::before{content:"";position:absolute;left:11px;top:20px;bottom:20px;width:4px;border-radius:4px;background:repeating-linear-gradient(var(--line) 0 10px,transparent 10px 18px)}
.lvl{position:relative;display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.lvl::before{content:attr(data-n);position:absolute;left:-30px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.lvl.beaten::before{content:"✓";background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lvl.open::before{border-color:var(--pc);color:var(--ink)}
.lvl.locked{opacity:.55;box-shadow:none}
.lvl.locked .av{filter:grayscale(1)}
.lvl.boss{background:linear-gradient(135deg,var(--gold-soft),var(--surface) 75%);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.lvl.boss::before{content:"👑";font-size:13px}
.lvl > .av{width:58px;height:58px;font-size:32px;border-width:3px}
.lvl .info{flex:1;min-width:0}
.lvl .nm{font-weight:800;font-size:17px;line-height:1.2}
.lvl .tg{font-size:13px;color:var(--muted)}
.lvl .pw{font-size:13px;margin-top:4px}
.lvl .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}
.stars .off{color:var(--line)}
.lvl-tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lvl.boss .lvl-tag{color:var(--gold)}
.intro{text-align:center}
.intro .av{width:110px;height:110px;font-size:62px;border-width:5px}
.intro .nm{font-size:24px;font-weight:800;margin-top:10px}
.quote{position:relative;background:var(--surface-2);border-radius:14px;padding:12px 16px;margin:14px 0 10px;font-style:italic;font-size:15px}
.quote::before{content:"";position:absolute;top:-8px;left:50%;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:var(--surface-2)}
.intro .quote .av{width:30px;height:30px;font-size:16px;border-width:2px;vertical-align:middle;margin-right:6px}
.vd.lucky::before{content:"🍀";position:absolute;top:-6px;right:-4px;font-size:18px;z-index:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.aibar{display:flex;align-items:center;gap:10px;font-weight:600}
.thinking span{display:inline-block;animation:blink 1.2s infinite}
.thinking span:nth-child(2){animation-delay:.2s}.thinking span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
@media (max-width:640px){
  .path{padding-left:22px}
  .path::before{left:7px}
  .lvl{padding:12px;gap:10px;align-items:flex-start}
  .lvl::before{left:-24px;width:22px;height:22px;font-size:11px}
  .lvl > .av{width:46px;height:46px;font-size:26px}
  .lvl .act{position:static}
  .lvl{flex-wrap:wrap}
  .lvl .act{width:100%}
  .lvl .act .btn{width:100%;justify-content:center}
}

/* caratteri grandi */
html.big body{zoom:1.15}

/* tablet / PC in orizzontale: dadi a sinistra, cartella a destra */
@media (min-width:900px) and (orientation:landscape){
  .gamegrid.virtual{display:grid;grid-template-columns:minmax(300px,340px) 1fr;gap:18px;align-items:start}
  .gamegrid.virtual .tray{position:sticky;top:72px;margin-top:0}
  .gamegrid.virtual .sheet-wrap{margin-top:0 !important}
  .gamegrid.virtual .vdice{gap:3px;flex-wrap:nowrap}
  .gamegrid.virtual .vd{padding:2px}
  .gamegrid.virtual .vd svg,.gamegrid.virtual .vd .q{width:50px;height:50px}
}
@media (max-height:820px) and (orientation:landscape) and (min-width:641px){
  .cell{min-height:36px;font-size:16px}
  .sheet .lab{padding:4px 12px}
  .sheet .lab .h{font-size:11px}
}

/* telefono */
@media (max-width:640px){
  body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
  header{position:static;background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
  .head{gap:8px;padding:10px 12px}
  .brand{font-size:16px}
  .hbtns .lbl{display:none}
  .hbtns .btn.sm{min-width:38px;justify-content:center}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);gap:0;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  nav button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;padding:6px 2px;border-radius:12px}
  nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
  .ni{display:block;font-size:20px;line-height:1.1}
  .wrap{padding:0 12px 24px}
  .card{padding:16px;border-radius:14px}
  .gamebar{margin:12px 0 10px;gap:6px;flex-wrap:nowrap}
  .gamebar .btn{padding:8px 11px}
  .gamebar .btn .lbl{display:none}
  .gamebar .spacer{display:none}
  .turn{flex:1;min-width:0}
  .turn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vd{padding:2px}
  .ptabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding:2px 2px 4px;scrollbar-width:none}
  .sheet .lab{min-width:0;width:40%;padding:6px 10px}
  .sheet .lab .h{display:none}
  .sheet thead th{min-width:0;padding:8px 4px}
  .sheet thead th .nm{max-width:100px}
  .swipehint{display:block;text-align:center;font-size:12px;color:var(--muted);margin:6px 0 0}
  .vdice{gap:4px}
  .vd svg,.vd .q{width:54px;height:54px}
  .btn.big{width:100%;justify-content:center}
  #toast{bottom:calc(80px + env(safe-area-inset-bottom))}
  .modepick button{padding:10px 12px}
  .banner{padding:10px 12px;gap:10px;margin-top:12px;flex-wrap:nowrap}
  .banner > span:first-child,.banner .txt span{display:none}
  .banner .txt{min-width:0;font-size:14px}
  .banner .btn{padding:7px 12px;min-height:36px;white-space:nowrap}
  .again .avs{display:none}
  .again span[style]{margin-left:0 !important}
}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="head">
    <div class="brand"><span id="logo"></span> Segnapunti Yahtzee</div>
    <nav id="nav">
      <button data-act="tab" data-tab="game"><span class="ni">🎲</span>Partita</button>
      <button data-act="tab" data-tab="story"><span class="ni">🗺️</span>Storia</button>
      <button data-act="tab" data-tab="players"><span class="ni">👥</span>Giocatori</button>
      <button data-act="tab" data-tab="history"><span class="ni">📜</span>Storico</button>
      <button data-act="tab" data-tab="records"><span class="ni">🏆</span>Record</button>
      <button data-act="tab" data-tab="rules"><span class="ni">📖</span>Regole</button>
    </nav>
    <div class="hbtns">
      <button class="btn sm hb" data-act="import" title="Carica un file di backup">⬆<span class="lbl"> Carica backup</span></button>
      <button class="btn sm hb" data-act="export" title="Salva un file di backup">⬇<span class="lbl"> Scarica backup</span></button>
      <button class="btn sm hb" data-act="settings" title="Impostazioni" aria-label="Impostazioni">⚙️</button>
    </div>
  </div>
</header>
<main class="wrap" id="view"></main>
<input type="file" id="impfile" accept=".json,application/json" hidden>
<div id="turnov" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
/* ===================== Dati e regole ===================== */
const LS_KEY = 'yahtzee-segnapunti-v1';
const UP = [
  {k:'ones',  label:'Uno',  face:1, hint:'Somma dei dadi con 1'},
  {k:'twos',  label:'Due',  face:2, hint:'Somma dei dadi con 2'},
  {k:'threes',label:'Tre',  face:3, hint:'Somma dei dadi con 3'},
  {k:'fours', label:'Quattro',face:4, hint:'Somma dei dadi con 4'},
  {k:'fives', label:'Cinque',face:5, hint:'Somma dei dadi con 5'},
  {k:'sixes', label:'Sei',  face:6, hint:'Somma dei dadi con 6'},
];
const LO = [
  {k:'tris',   label:'Tris',          hint:'3 uguali · somma di tutti i dadi'},
  {k:'poker',  label:'Poker',         hint:'4 uguali · somma di tutti i dadi'},
  {k:'full',   label:'Full',          hint:'3 + 2 uguali · 25 punti', fixed:25},
  {k:'ss',     label:'Scala piccola', hint:'4 in sequenza · 30 punti', fixed:30},
  {k:'ls',     label:'Scala grande',  hint:'5 in sequenza · 40 punti', fixed:40},
  {k:'yahtzee',label:'Yahtzee',       hint:'5 uguali · 50 punti', fixed:50},
  {k:'chance', label:'Chance',        hint:'Qualsiasi · somma di tutti i dadi'},
];
const CATS = [...UP, ...LO];
const CAT = Object.fromEntries(CATS.map(c => [c.k, c]));
const NCATS = CATS.length;
const COLORS = ['#d9534f','#e8883a','#d4a017','#3f9b5a','#2f8f9d','#3b6fd1','#7a52c7','#c04b8e','#6b6257'];
const EMOJIS = ['🙂','😎','🤠','🦊','🐻','🐼','🐸','🦁','🐯','🐙','🦄','🐝','🌵','🍀','🔥','⭐','🎲','🚀','👑','🍕','☕','⚽','🎸','👵','👴'];

/* ---------- Modalità storia: avversari, minigiochi, percorso ----------
   skill = quanto spesso gioca la mossa migliore (altrimenti gioca "a istinto")
   bias = peso di ogni faccia dei SUOI dadi · extraRoll = probabilità di un 4° lancio nel turno
   match = probabilità che un dado rilanciato copi i dadi uguali tenuti · straight = idem per il numero che manca alla scala */
const AIS = [
  {id:'ai-sergio', name:'Sergio Tantiuno', emoji:'🐌', color:'#7d8590', tag:'Il re dell’1',
   power:'I suoi dadi escono spesso con l’1 e lui si accontenta presto: per lui è una maledizione.', skill:0, dumb:true, stop:.4, bias:[0,1.5,1,1,1,1,1],
   intro:'Uno, uno, uno… ma perché sempre uno?!', winQ:'Visto? Anche l’1 a volte porta fortuna!', loseQ:'Lo sapevo: è tutta colpa degli uni.'},
  {id:'ai-pippo', name:'Pippo Dadomolle', emoji:'🐢', color:'#5f9e6e', tag:'Il principiante',
   power:'Nessun potere: si stanca presto, spesso non usa tutti i lanci.', skill:.1, stop:.3,
   intro:'Si lanciano tutti e cinque insieme, giusto?', winQ:'Ho vinto? Davvero? Mamma, ho vinto!', loseQ:'Beh, almeno mi sono divertito.'},
  {id:'ai-gianni', name:'Gianni il Fortunello', emoji:'🐞', color:'#d9534f', tag:'Nato con la camicia',
   power:'Una volta su quattro gli capita un lancio in più nel turno.', skill:.3, extraRoll:.25, stop:.2,
   intro:'Oggi me lo sento: è il mio giorno fortunato!', winQ:'Fortuna? No no, puro talento.', loseQ:'Mi sa che il quadrifoglio era un trifoglio…'},
  {id:'ai-mario', name:'Mario Trisdisei', emoji:'🎩', color:'#3b6fd1', tag:'Collezionista di sei',
   power:'I suoi dadi preferiscono il 6: i suoi tris valgono tanto.', skill:.5, stop:.15, bias:[0,1,1,1,1,1.1,1.4],
   intro:'Tre sei? Per me è colazione.', winQ:'Sei, sei, sei: la mia canzone preferita.', loseQ:'Oggi i sei erano in vacanza.'},
  {id:'ai-lucia', name:'Lucia Scalareale', emoji:'💃', color:'#c04b8e', tag:'Regina delle scale',
   power:'Quando insegue una scala, i dadi le portano spesso il numero che manca.', skill:.7, straight:.35,
   intro:'Uno, due, tre, quattro, cinque… sento la musica!', winQ:'Scala reale servita!', loseQ:'Mi è mancato un gradino.'},
  {id:'ai-gianna', name:'Gianna Pokerfacile', emoji:'🃏', color:'#7a52c7', tag:'Quattro uguali? Facile',
   power:'Quando tiene dadi uguali, quelli rilanciati tendono a copiarli.', skill:.8, match:.025,
   intro:'Quattro uguali? Facile come bere un caffè.', winQ:'Poker! Te l’avevo detto che era facile.', loseQ:'Stavolta il poker non è venuto… strano.'},
  {id:'ai-conte', name:'Il Conte Quadrifoglio', emoji:'🍀', color:'#2f8f5d', tag:'Fortuna di famiglia',
   power:'Fortunato in tutto: dadi che amano i numeri alti, lanci in più e dadi che si copiano.', skill:.9, bias:[0,.9,.95,1,1,1.1,1.15], match:.012, extraRoll:.06,
   intro:'La fortuna non si cerca, mio caro: si eredita.', winQ:'Come sempre: nobiltà e fortuna.', loseQ:'Inaudito! Chiamate il mio maggiordomo.'},
  {id:'ai-chiappone', name:'Mastro Chiappone', emoji:'👑', color:'#b8860b', boss:true, tag:'Il boss finale',
   power:'Il più fortunato del regno: in una partita su due fa almeno uno Yahtzee.', skill:1, match:.06, // tarato con simulazioni: circa 1 partita su 2 con almeno uno Yahtzee
   intro:'Chiappone non gioca a dadi. Sono i dadi che giocano per Chiappone.', winQ:'Chiappa, signori. Pura chiappa.', loseQ:'Impossibile… mi hai battuto in casa mia!'},
];
const AI_MAP = Object.fromEntries(AIS.map(a => [a.id, a]));
const isAI = id => typeof id === 'string' && id.startsWith('ai-');
const dcount = d => { const c = [0,0,0,0,0,0,0]; d.forEach(x => c[x]++); return c; };
const hasRun = (d, run) => run.every(n => d.includes(n));
const isFull = c => c.includes(3) && c.includes(2);
const MINIS = [
  {id:'mini-1', name:'La bisca del porto', emoji:'🎰', turns:6, tag:'Combinazioni del poker coi dadi',
   goals:[
     {label:'Coppia',          coins:1,  test:d => Math.max(...dcount(d)) >= 2},
     {label:'Doppia coppia',   coins:2,  test:d => dcount(d).filter(x => x >= 2).length >= 2 || Math.max(...dcount(d)) >= 4},
     {label:'Tris',            coins:2,  test:d => Math.max(...dcount(d)) >= 3},
     {label:'Scala piccola',   coins:3,  test:d => hasRun(d,[1,2,3,4]) || hasRun(d,[2,3,4,5]) || hasRun(d,[3,4,5,6])},
     {label:'Full',            coins:4,  test:d => isFull(dcount(d))},
     {label:'Poker',           coins:5,  test:d => Math.max(...dcount(d)) >= 4},
     {label:'Scala grande',    coins:5,  test:d => hasRun(d,[1,2,3,4,5]) || hasRun(d,[2,3,4,5,6])},
     {label:'Yahtzee',         coins:10, test:d => Math.max(...dcount(d)) === 5},
   ]},
  {id:'mini-2', name:'Il casinò di Chiappone', emoji:'🎲', turns:6, tag:'Combinazioni specifiche, premi più ricchi',
   goals:[
     {label:'Tutti dispari',       coins:3,  test:d => d.every(x => x % 2)},
     {label:'Somma esatta 20',     coins:3,  test:d => d.reduce((a,b) => a+b, 0) === 20},
     {label:'Tris di 6',           coins:4,  test:d => dcount(d)[6] >= 3},
     {label:'Scala da 1 a 5',      coins:5,  test:d => hasRun(d,[1,2,3,4,5])},
     {label:'Scala da 2 a 6',      coins:5,  test:d => hasRun(d,[2,3,4,5,6])},
     {label:'Full con tre 4',      coins:6,  test:d => isFull(dcount(d)) && dcount(d)[4] === 3},
     {label:'Poker di 5',          coins:7,  test:d => dcount(d)[5] >= 4},
     {label:'Yahtzee',             coins:12, test:d => Math.max(...dcount(d)) === 5},
   ]},
];
// il percorso: ogni 3 avversari un minigioco
const STORY = [{ai:0},{ai:1},{ai:2},{mini:0},{ai:3},{ai:4},{ai:5},{mini:1},{ai:6},{ai:7}];
const POWERS = {extra:{label:'+1 lancio', icon:'🎲', cost:3}, fix:{label:'Ritocco', icon:'✋', cost:8}};

const PRESET = ['Ale','Laura','Roby','Jo','Sere','Fra','Steu','Monica'];
const PRESET_EMOJI = ['😎','🦊','🐻','🐸','🦄','🐯','🚀','🐝'];
function defaults(){
  return {
    players: PRESET.map((n,i) => ({id:'p-'+n.toLowerCase(), name:n, nick:'', emoji:PRESET_EMOJI[i], color:COLORS[i % COLORS.length], created:0})),
    current:null, games:[], lastBackup:0, story:{}, storyHero:null, mini:null,
    prefs:{mode:'guided', theme:'auto', big:false, wake:true, turnBanner:true, confirmZero:true, shake:false, vibrate:true, sound:true, hints:true},
    diceStats:{rolls:0, faces:[0,0,0,0,0,0,0], yahtzees:0},
  };
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const d = JSON.parse(raw); return Object.assign(defaults(), d, {prefs:Object.assign(defaults().prefs, d.prefs||{})}); }
  }catch(e){}
  return defaults();
}
let S = load();
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){ toast('Attenzione: il browser non permette di salvare'); } }

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const player = id => S.players.find(p => p.id === id) || AI_MAP[id];
const fmtDate = t => new Date(t).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
const fmtDateTime = t => fmtDate(t) + ', ' + new Date(t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});

function calc(sc, yb){
  const upper = UP.reduce((a,c) => a + (sc[c.k] ?? 0), 0);
  const bonus = upper >= 63 ? 35 : 0;
  const lower = LO.reduce((a,c) => a + (sc[c.k] ?? 0), 0);
  const yBonus = (yb || 0) * 100;
  const filled = CATS.filter(c => sc[c.k] != null).length;
  // massimo ancora raggiungibile nella sezione superiore
  const upperMax = upper + UP.filter(c => sc[c.k] == null).reduce((a,c) => a + c.face*5, 0);
  return {upper, bonus, upperTot:upper+bonus, lower, yBonus, lowerTot:lower+yBonus, total:upper+bonus+lower+yBonus, filled, upperMax};
}

function diceScore(k, dice, joker){
  const cnt = [0,0,0,0,0,0,0]; dice.forEach(d => cnt[d]++);
  const sum = dice.reduce((a,b) => a+b, 0);
  const max = Math.max(...cnt);
  const has = s => s.every(n => cnt[n] > 0);
  const c = CAT[k];
  if(c.face) return cnt[c.face] * c.face;
  switch(k){
    case 'tris':  return max >= 3 ? sum : 0;
    case 'poker': return max >= 4 ? sum : 0;
    case 'full':  return (joker || (cnt.includes(3) && cnt.includes(2))) ? 25 : 0;
    case 'ss':    return (joker || has([1,2,3,4]) || has([2,3,4,5]) || has([3,4,5,6])) ? 30 : 0;
    case 'ls':    return (joker || has([1,2,3,4,5]) || has([2,3,4,5,6])) ? 40 : 0;
    case 'yahtzee': return max === 5 ? 50 : 0;
    case 'chance':  return sum;
  }
  return 0;
}

function guidedOptions(c){
  if(c.face) return [0,1,2,3,4,5].map(n => n*c.face);
  if(c.fixed) return [c.fixed, 0];
  const arr = c.k === 'chance' ? [] : [0];
  for(let i=5; i<=30; i++) arr.push(i);
  return arr;
}

let AC = null;
function audio(){
  if(!S.prefs.sound) return null;
  if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; AC = new C(); }
  if(AC.state === 'suspended') AC.resume();

// rumore di dadi: tanti piccoli "clic" filtrati
function sndRoll(n){
  const c = audio(); if(!c) return;
  const t0 = c.currentTime;
  for(let i=0; i<n*2+3; i++){
    const len = .035, buf = c.createBuffer(1, Math.floor(c.sampleRate*len), c.sampleRate), d = buf.getChannelData(0);
    for(let j=0; j<d.length; j++) d[j] = (Math.random()*2-1) * Math.pow(1 - j/d.length, 3);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), gn = c.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = 1500 + Math.random()*2500; f.Q.value = 2.5; gn.gain.value = .55;
    s.connect(f).connect(gn).connect(c.destination); s.start(t0 + Math.random()*.38);
  }
}
function sndTone(freqs, dur=.12){
  const c = audio(); if(!c) return;
  freqs.forEach((fq,i) => {
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + i*dur;
    o.type = 'triangle'; o.frequency.value = fq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.16, t+.01); g.gain.exponentialRampToValueAtTime(.001, t+dur*1.8);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur*2);
  });
}

  if(lastAcc){
    const d = Math.abs(a.x-lastAcc.x) + Math.abs(a.y-lastAcc.y) + Math.abs(a.z-lastAcc.z);
    if(d > 28 && Date.now() - lastShake > 1200 && !dlg.open){

      else if(tab === 'story' && S.mini){ lastShake = Date.now(); miniRoll(); }
    }

});

  g.undo.push(JSON.stringify({scores:g.scores, yb:g.yb, roll:g.roll}));
  if(g.undo.length > 60) g.undo.shift();
}
function undo(){
  const g = S.current; if(!g || !g.undo.length) return;
  const s = JSON.parse(g.undo.pop()); g.scores = s.scores; g.yb = s.yb; if(s.roll) g.roll = s.roll;
  hint = null; save(); render(); toast('Ultima modifica annullata');
}

/* ---------- Dadi virtuali ---------- */
// dado equo: crypto con scarto per evitare distorsioni (ogni faccia 1/6 esatto)
function d6(){
  const a = new Uint8Array(1);
  do { crypto.getRandomValues(a); } while(a[0] >= 252);
  return a[0] % 6 + 1;
}
let spinIdx = [];
function nowPlayer(g){
  const t = g.playerIds.map(id => calc(g.scores[id], g.yb[id]).filled);
  const m = Math.min(...t);
  return m >= NCATS ? null : g.playerIds[t.indexOf(m)];
}
function rollDice(){
  const g = S.current, r = g && g.roll;
  if(!g || !g.virtual || r.n >= (r.max || 3) || !nowPlayer(g) || isAI(nowPlayer(g))) return;
  if(r.n > 0 && r.held.every(Boolean)){ toast('Hai tenuto tutti i dadi: scegli una casella'); return; }
  spinIdx = [];
  r.dice = r.dice.map((v,i) => { if(r.n > 0 && r.held[i]) return v; spinIdx.push(i); const x = d6(); g.faces[x]++; S.diceStats.faces[x]++; return x; });
  r.n++; g.rolls++; S.diceStats.rolls++;
  if(r.n === 1) r.held = [false,false,false,false,false];
  hint = null;
  const isY = r.dice.every(x => x === r.dice[0]);
  sndRoll(spinIdx.length);
  if(isY){
    S.diceStats.yahtzees++; toast('🎉 YAHTZEE!');
    setTimeout(() => sndTone([523,659,784,1047], .11), 420); buzz([80,60,80,60,220]);
  } else buzz(35);
  save(); render(); spinIdx = [];
}
function toggleHold(i){
  const g = S.current, r = g.roll;
  if(isAI(nowPlayer(g)) || r.n === 0 || r.n >= (r.max || 3)) return;
  r.held[i] = !r.held[i]; save(); render();
}

/* ---------- Avversari virtuali ---------- */
function biased(w){
  if(!w) return d6();
  let x = Math.random() * (w[1]+w[2]+w[3]+w[4]+w[5]+w[6]);
  for(let f=1; f<=6; f++){ x -= w[f]; if(x < 0) return f; }
  return 6;
}
// un lancio dell'avversario, con la sua "fortuna": i dadi aiutati vengono segnati con il quadrifoglio
function aiRoll(r, ai){
  const first = r.n === 0;
  const held = first ? [] : r.dice.filter((v,i) => r.held[i]);
  const cnt = dcount(held), mc = Math.max(...cnt), mf = mc ? cnt.lastIndexOf(mc) : 0;
  const have = new Set(held);
  const chasingRun = held.length >= 3 && have.size === held.length && (held.every(n => n <= 5) || held.every(n => n >= 2));
  r.spin = []; r.lucky = [false,false,false,false,false];
  r.dice = r.dice.map((v,i) => {
    if(!first && r.held[i]) return v;
    r.spin.push(i);
    let x = biased(ai.bias);
    if(mc >= 2 && ai.match && Math.random() < ai.match){ if(x !== mf){ x = mf; r.lucky[i] = true; } }
    else if(chasingRun && ai.straight && Math.random() < ai.straight){
      const win = [[1,2,3,4,5],[2,3,4,5,6]].sort((a,b) => b.filter(n => have.has(n)).length - a.filter(n => have.has(n)).length)[0];
      const miss = win.find(n => !have.has(n));
      if(miss && x !== miss){ x = miss; r.lucky[i] = true; }
    }
    have.add(x);
    return x;
  });
  if(first) r.held = [false,false,false,false,false];
  r.n++;
}
// mosse "a istinto": tiene il gruppo più numeroso, o una scala se non ha doppioni
function naivePlan(sc, d, dumb){
  const c = dcount(d); let best = 6, bc = 0;
  for(let f=6; f>=1; f--) if(c[f] > bc){ bc = c[f]; best = f; }
  if(bc === 5) return {type:'score'};
  if(dumb && bc < 3) return {type:'hold', h:[]}; // ingenuo: tiene solo i tris, altrimenti rilancia tutto
  if(bc === 1){
    for(const run of [[3,4,5,6],[2,3,4,5],[1,2,3,4]]) if(run.filter(n => c[n]).length >= 3) return {type:'hold', h:run.filter(n => c[n])};
  }
  return {type:'hold', h:Array(bc).fill(best)};
}
function naiveBox(sc, d){
  const js = jokerState(sc, d);
  const open = CATS.filter(c => sc[c.k] == null && (!js.allowed || js.allowed.includes(c.k)));
  let best = null, bv = -1;
  for(const c of open){ const v = diceScore(c.k, d, js.joker); if(v > bv){ bv = v; best = c.k; } }
  if(bv === 0) best = open.slice().sort((a,b) => PAR[a.k] - PAR[b.k])[0].k;
  return best;
}
// il turno di un avversario, passo per passo (usato sia dal gioco sia dalle simulazioni)
function* aiTurnGen(sc, ai, r){
  r.max = 3 + (Math.random() < (ai.extraRoll || 0) ? 1 : 0);
  for(let n=1; n<=r.max; n++){
    aiRoll(r, ai);
    yield {type:'roll', extra:n === 4};
    if(n === r.max) break;
    const smart = Math.random() < ai.skill;
    if(!smart && ai.stop && Math.random() < ai.stop) break; // pigrizia: si accontenta
    const plan = smart ? suggest(sc, r.dice, Math.min(2, r.max - n)) : naivePlan(sc, r.dice, ai.dumb);
    if(plan.type === 'score') break;
    r.held = holdMask(r.dice, plan.h);
    yield {type:'hold'};
  }
  return Math.random() < ai.skill ? suggest(sc, r.dice, 0).k : naiveBox(sc, r.dice);
}
let aiRunning = false, aiToken = 0;
async function runAI(){
  const g = S.current;
  if(!g || !g.story || aiRunning) return;
  const id = nowPlayer(g);
  if(!id || !isAI(id)) return;
  aiRunning = true;
  const tok = ++aiToken, ai = AI_MAP[id];
  const alive = () => S.current === g && tok === aiToken && nowPlayer(g) === id;
  const wait = ms => new Promise(res => setTimeout(res, S.prefs.aiFast ? ms/4 : ms));
  try{
    await wait(S.prefs.turnBanner ? 1500 : 600);
    if(!alive()) return;
    g.roll = freshRoll(); render();
    const gen = aiTurnGen(g.scores[id], ai, g.roll);
    let s;
    while(true){
      if(!alive()) return;
      s = gen.next();
      if(s.done) break;
      if(s.value.type === 'roll'){
        spinIdx = g.roll.spin; sndRoll(spinIdx.length);
        if(s.value.extra) toast(`🍀 ${ai.name} ha un lancio in più!`);
        if(g.roll.dice.every(x => x === g.roll.dice[0])){ toast(`😱 YAHTZEE di ${ai.name}!`); setTimeout(() => sndTone([523,659,784,1047], .11), 420); }
        render(); spinIdx = [];
        await wait(1100);
      } else { render(); await wait(800); }
    }
    if(!alive()) return;
    aiRunning = false;
    await scoreVirtual(id, s.value, true);
  } finally { if(tok === aiToken) aiRunning = false; }
}
// simulazione veloce di una partita intera di un avversario (per tarare la difficoltà)
function simAI(ai){
  const sc = {}; let yb = 0;
  for(let t=0; t<NCATS; t++){
    const r = freshRoll(), gen = aiTurnGen(sc, ai, r);
    let s; while(!(s = gen.next()).done){}
    const js = jokerState(sc, r.dice);
    if(js.isY && sc.yahtzee === 50) yb++;
    sc[s.value] = diceScore(s.value, r.dice, js.joker);
  }
  return {total:calc(sc, yb).total, y:sc.yahtzee === 50 || yb > 0};
}
// regola del jolly: quali caselle sono ammesse con questi dadi
function jokerState(sc, dice){
  const isY = dice[0] > 0 && dice.every(x => x === dice[0]);
  if(!isY || sc.yahtzee == null) return {isY, joker:false, allowed:null};
  const upK = UP[dice[0]-1].k;
  if(sc[upK] == null) return {isY, joker:false, allowed:[upK]};
  const lowOpen = LO.filter(c => sc[c.k] == null).map(c => c.k);
  if(lowOpen.length) return {isY, joker:true, allowed:lowOpen};
  return {isY, joker:true, allowed:UP.filter(c => sc[c.k] == null).map(c => c.k)};
}
async function scoreVirtual(pid, k, confirmed=false){
  const g = S.current, sc = g.scores[pid], d = g.roll.dice;
  const js = jokerState(sc, d);
  if(js.allowed && !js.allowed.includes(k)){
    toast(js.joker ? 'Regola del jolly: usa una casella inferiore libera' : `Regola del jolly: devi segnare in “${CAT[js.allowed[0]].label}”`);
    return;
  }
  const v = diceScore(k, d, js.joker);
  const bonus = js.isY && sc.yahtzee === 50;
  if(v === 0 && !bonus && !confirmed && S.prefs.confirmZero){
    const ok = await ask(`Sbarrare “${CAT[k].label}”?`, `Con questi dadi la casella vale <b>0 punti</b> e non potrai più usarla.${g.roll.n < 3 ? ' Hai ancora ' + (3 - g.roll.n) + (3 - g.roll.n === 1 ? ' lancio.' : ' lanci.') : ''}`,
      [{label:'No, torna ai dadi', value:null}, {label:'Sì, segna 0', value:true, kind:'danger solid'}]);
    if(ok && S.current === g) scoreVirtual(pid, k, true);
    return;
  }
  pushUndo();
  sc[k] = v; if(bonus) g.yb[pid] = (g.yb[pid]||0) + 1;
  g.roll = freshRoll(); hint = null;
  flashCell = pid + '|' + k;
  sndTone(bonus ? [784,1047,1319] : v ? [880] : [330], .08);
  save(); render(); flashCell = null;
  toast(`${(player(pid)||{}).name}: ${v} in ${CAT[k].label}${bonus ? ' · +100 bonus!' : ''}`);
  if(isComplete(g)) setTimeout(() => finishGame(true), 600);
}
// probabilità di completare uno Yahtzee nei lanci rimasti, tenendo il gruppo più numeroso
function yahtzeeChance(k, rolls){
  const C = (n,r) => { let x = 1; for(let i=1;i<=r;i++) x = x*(n-r+i)/i; return x; };
  let p = [0,0,0,0,0,0]; p[k] = 1;
  for(let t=0; t<rolls; t++){
    const q = [0,0,0,0,0,0];
    for(let s=0; s<=5; s++){
      if(!p[s]) continue;
      if(s === 5){ q[5] += p[s]; continue; }
      const m = 5 - s;
      for(let j=0; j<=m; j++) q[s+j] += p[s] * C(m,j) * Math.pow(1/6,j) * Math.pow(5/6,m-j);
    }
    p = q;
  }
  return p[5];
}
const pct = x => (x*100).toLocaleString('it-IT', {maximumFractionDigits: x < .01 ? 2 : 1}) + '%';
function faceBars(faces){
  const tot = faces.reduce((a,b) => a+b, 0);
  const max = Math.max(1/6, ...faces.slice(1).map(f => tot ? f/tot : 0)) * 1.25;
  return `<div class="bars">${[1,2,3,4,5,6].map(n => {
    const share = tot ? faces[n]/tot : 0;
    return `<div class="bar"><div class="track"><div class="fill" style="height:${share/max*100}%"></div><div class="exp" style="bottom:${(1/6)/max*100}%"></div></div>${die(n,20)}<b>${tot ? pct(share) : '—'}</b><span class="mini">${faces[n]}</span></div>`;
  }).join('')}</div><p class="mini" style="margin-top:8px">Linea tratteggiata = valore atteso 16,7% (1 su 6). Più lanci fai, più le barre si avvicinano alla linea.</p>`;
}
/* ---------- Consiglio: quali dadi tenere / dove segnare ----------
   Valuta ogni casella come "punti ottenuti − punti medi che quella casella vale in una partita ben giocata",
   con una spinta in più verso il bonus da 35. Poi calcola esattamente il valore atteso di ogni
   combinazione di dadi da tenere, guardando avanti fino a 2 lanci. */
const PAR = {ones:2.11, twos:5.28, threes:8.57, fours:12.16, fives:15.69, sixes:19.19, tris:21.66, poker:13.10, full:22.59, ss:29.46, ls:32.71, yahtzee:16.87, chance:22.01};
const OUTC = {};
function outcomes(m){ // tutti i risultati di m dadi (ordinati) con la loro probabilità
  if(OUTC[m]) return OUTC[m];
  const map = new Map();
  const rec = a => { if(a.length === m){ const k = a.slice().sort().join(''); map.set(k, (map.get(k)||0) + 1); return; } for(let f=1; f<=6; f++){ a.push(f); rec(a); a.pop(); } };
  rec([]);
  const tot = Math.pow(6, m);
  return OUTC[m] = [...map].map(([k,c]) => ({d: k ? k.split('').map(Number) : [], p: c/tot}));
}
function bestBox(sc, D){
  const js = jokerState(sc, D), extra = js.isY && sc.yahtzee === 50 ? 100 : 0;
  const t = calc(sc, 0), chase = t.upper < 63 && t.upperMax >= 63;
  let v = -Infinity, k = null, pts = 0;
  for(const c of CATS){
    if(sc[c.k] != null || (js.allowed && !js.allowed.includes(c.k))) continue;
    const p = diceScore(c.k, D, js.joker);
    let x = p + extra - PAR[c.k];
    if(c.face && chase) x += (p - 3*c.face) * .9;
    if(x > v){ v = x; k = c.k; pts = p; }
  }
  return {v, k, pts};
}
function suggest(sc, D, rollsLeft){
  const bv = new Map(), v1 = new Map();
  const BV = d => { const k = d.join(''); let x = bv.get(k); if(x === undefined){ x = bestBox(sc, d).v; bv.set(k, x); } return x; };
  const holdsOf = d => { const s = new Map(); for(let m=0; m<32; m++){ const h = []; for(let i=0; i<5; i++) if(m >> i & 1) h.push(d[i]); s.set(h.join(''), h); } return [...s.values()]; };
  const expect = (h, val) => { let e = 0; for(const o of outcomes(5 - h.length)) e += o.p * val([...h, ...o.d].sort()); return e; };
  const V1 = d => { const k = d.join(''); let x = v1.get(k); if(x === undefined){ x = -Infinity; for(const h of holdsOf(d)) x = Math.max(x, h.length === 5 ? BV(d) : expect(h, BV)); v1.set(k, x); } return x; };
  const sorted = D.slice().sort(), now = bestBox(sc, sorted);
  if(rollsLeft <= 0) return {type:'score', k:now.k, pts:now.pts};
  const next = rollsLeft === 1 ? BV : V1;
  let best = {e:now.v, h:sorted};
  for(const h of holdsOf(sorted)){ if(h.length === 5) continue; const e = expect(h, next); if(e > best.e + 1e-9) best = {e, h}; }
  return best.h.length === 5 ? {type:'score', k:now.k, pts:now.pts} : {type:'hold', h:best.h, k:now.k, pts:now.pts};
}
const rollSig = g => g.roll.n + ':' + g.roll.dice.join('') + ':' + nowPlayer(g);
function holdMask(dice, h){ const need = [...h]; return dice.map(v => { const i = need.indexOf(v); if(i >= 0){ need.splice(i,1); return true; } return false; }); }
function askHint(){
  const g = S.current, now = nowPlayer(g);
  if(!g || !g.virtual || !now || !g.roll.n) return;
  hint = {sig:rollSig(g), res:'…'}; render();
  setTimeout(() => { if(hint && hint.sig === rollSig(g)){ hint.res = suggest(g.scores[now], g.roll.dice, Math.min(2, (g.roll.max || 3) - g.roll.n)); render(); } }, 30);
}
function applyHint(){
  const g = S.current;
  if(!hint || hint.res.type !== 'hold' || g.roll.n >= (g.roll.max || 3)) return;
  g.roll.held = holdMask(g.roll.dice, hint.res.h); save(); render();
}

  const dice = r.dice.map((v,i) => `<button class="vd ${r.held[i] && r.n>0 && r.n<mx ? 'held':''} ${spinIdx.includes(i)?'spin':''} ${sugg && sugg[i] ? 'sugg' : ''} ${r.lucky && r.lucky[i] ? 'lucky' : ''}" data-act="hold" data-i="${i}" aria-pressed="${r.held[i]}" aria-label="Dado ${i+1}${v?': '+v:''}" ${r.n===0||r.n>=mx?'tabindex="-1"':''}>${v ? die(v,64) : '<span class="q">?</span>'}</button>`).join('');
  if(isAI(nowId)){
    return `<div class="card tray">

      <div class="trayinfo">${r.n ? `Lancio ${r.n} di ${mx}` : 'Prende i dadi…'}${r.lucky && r.lucky.some(Boolean) ? ' · 🍀 = dado aiutato dalla fortuna' : ''}</div>
      <button class="hintbtn" data-act="aifast">${S.prefs.aiFast ? '🐢 Velocità normale' : '⏩ Più veloce'}</button>

  }

  if(g.story && r.n > 0){
    const st = storyOf(g.story.pid);

    const canFix = !r.fixUsed && st.coins >= POWERS.fix.cost;
    powerHTML = `<div class="hintbox"><b>💰 ${st.coins}</b>
      <button class="btn sm" data-act="power" data-p="extra" ${canExtra?'':'disabled'} title="Un lancio in più in questo turno (dopo il 3°)">${POWERS.extra.icon} ${POWERS.extra.label} · 💰${POWERS.extra.cost}</button>
      <button class="btn sm" data-act="power" data-p="fix" ${canFix?'':'disabled'} title="Gira un dado sulla faccia che vuoi">${POWERS.fix.icon} ${POWERS.fix.label} · 💰${POWERS.fix.cost}</button></div>`;
  }
  let hintHTML = '';
  if(r.n > 0 && S.prefs.hints){
    if(loading) hintHTML = '<div class="hintbox">💡 Sto pensando…</div>';
    else if(hintRes && hintRes.type === 'hold'){
      const same = sugg.every((s,i) => s === !!r.held[i]);
      hintHTML = `<div class="hintbox">💡 ${hintRes.h.length ? `Tieni ${hintRes.h.map(n => die(n,22)).join('')} e rilancia gli altri` : 'Rilancia tutti e 5 i dadi'}
        ${same ? '' : '<button class="btn sm primary" data-act="applyhint">Applica</button>'}</div>`;
    } else if(hintRes && hintRes.type === 'score'){
      hintHTML = `<div class="hintbox">💡 Ti conviene segnare <b>${hintRes.pts}</b> in <b>${CAT[hintRes.k].label}</b> (casella evidenziata)</div>`;
    } else hintHTML = '<button class="hintbtn" data-act="hint">💡 Consiglio</button>';
  }
  let info;
  if(r.n === 0) info = `Tocca a <b>${esc(p.name)}</b>: lancia i dadi${S.prefs.shake ? ', anche scuotendo il telefono' : ''}.`;

      + (ych != null && r.n < mx ? `<br>Probabilità di Yahtzee con i lanci rimasti (tenendo i ${k} uguali): <b>${pct(ych)}</b>` : '');

function isComplete(g){ return g.playerIds.every(id => calc(g.scores[id], g.yb[id]).filled === NCATS); }

async function endGame(){
  const g = S.current;
  if(isComplete(g)) return finishGame(true);
  if(g.story){
    const ai = AI_MAP[g.story.aiId];
    const v = await ask('Ritirarti?', `Se ti ritiri la sfida contro <b>${esc(ai.name)}</b> è persa. Potrai riprovarla quando vuoi.`, [{label:'Continua a giocare', value:null}, {label:'Mi ritiro', value:true, kind:'danger solid'}]);
    if(v && S.current === g){ aiToken++; finishGame(false); }
    return;
  }
  const v = await ask('Terminare la partita?', 'Alcune caselle sono ancora vuote. Le partite incomplete vengono salvate nello storico ma <b>non contano</b> per record e statistiche.',
    [{label:'Continua a giocare', value:null}, {label:'Elimina partita', value:'discard', kind:'danger'}, {label:'Salva nello storico', value:'save', kind:'primary'}]);
  if(v === 'save') finishGame(false);
  else if(v === 'discard'){ S.current = null; save(); render(); toast('Partita eliminata'); }
}

function finishGame(complete){
  const g = S.current;
  const prevBest = Math.max(-Infinity, ...S.games.filter(x => x.complete).flatMap(x => x.results.filter(r => !isAI(r.pid)).map(r => r.total)));
  const results = g.playerIds.map(id => {
    const p = player(id) || {name:'?', emoji:'❔', color:'#888'};
    return {pid:id, name:p.name, emoji:p.emoji, color:p.color, scores:{...g.scores[id]}, yb:g.yb[id]||0, ...calc(g.scores[id], g.yb[id])};
  });
  const max = Math.max(...results.map(r => r.total));
  const game = {id:g.id, started:g.started, ended:Date.now(), complete, virtual:!!g.virtual, results, winners:results.filter(r => r.total === max).map(r => r.pid)};
  if(g.story){
    const me = results.find(r => r.pid === g.story.pid), opp = results.find(r => r.pid === g.story.aiId);
    const win = complete && me.total > opp.total;
    const st = storyOf(g.story.pid), node = STORY.findIndex(n => n.ai === AIS.findIndex(a => a.id === g.story.aiId));
    const firstWin = win && !st.beaten[g.story.aiId];
    if(complete) st.best[g.story.aiId] = Math.max(st.best[g.story.aiId] || 0, me.total);
    if(win){ st.beaten[g.story.aiId] = true; st.step = Math.max(st.step, node + 1); }
    game.story = {...g.story, win};
    S.games.unshift(game); S.current = null; hint = null; save(); render();
    if(win) sndTone([523,659,784,659,784,1047], .13); else if(complete) sndTone([392,330,262], .2);
    return showStoryFinal(game, me, opp, win, firstWin, node, complete && me.total > prevBest && !isAI(me.pid));
  }
  S.games.unshift(game); S.current = null; hint = null; save(); render();
  if(complete) sndTone([523,659,784,659,784,1047], .13);
  const humanMax = Math.max(-Infinity, ...results.filter(r => !isAI(r.pid)).map(r => r.total));
  showFinal(game, complete && results.length && humanMax > prevBest ? humanMax : null);
}

function showFinal(game, newRecord){
  const sorted = [...game.results].sort((a,b) => b.total - a.total);
  const medals = ['🥇','🥈','🥉'];
  let pos = 0, last = null;
  const rows = sorted.map((r,i) => {
    if(r.total !== last){ pos = i; last = r.total; }
    const win = game.winners.includes(r.pid);
    return `<div class="f ${win?'win':''}"><span class="pos">${medals[pos] || (pos+1)+'°'}</span>${av(r)}<span class="n">${esc(r.name)}${newRecord && r.total===newRecord?'<span class="newrec">NUOVO RECORD</span>':''}</span><span class="s">${r.total}</span></div>`;
  }).join('');
  const w = sorted.filter(r => game.winners.includes(r.pid)).map(r => esc(r.name));
  dlg.innerHTML = `<div class="dlg-h"><div style="font-size:34px">🏆</div><div><div class="ttl">${game.complete ? 'Partita finita!' : 'Partita salvata'}</div><div class="hh">${w.length>1 ? 'Pareggio tra ' + w.join(' e ') : 'Vince ' + w[0]}</div></div></div>
    <div class="dlg-b"><div class="final-list">${rows}</div>
      <div class="note" style="margin-top:14px">💾 Partita salvata nello storico. Scarica il backup per non perderla.</div></div>
    <div class="dlg-f"><button class="btn left" data-act="export">⬇ Salva backup</button><button class="btn" data-act="close">Chiudi</button><button class="btn primary" data-act="rematch" data-g="${game.id}">Rivincita ↻</button></div>`;

}

function focusManual(){ if(M && M.mode === 'manual'){ const i = document.getElementById('manual'); if(i){ i.focus(); i.select(); } } }

function diceInfo(){
  const g = S.current, c = CAT[M.k];
  const sc = {...g.scores[M.pid], [M.k]: null}; // la casella che si sta compilando conta come libera
  const d = M.dice;
  if(d.length < 5) return null;
  const isY = d.every(x => x === d[0]);
  const upK = isY ? UP[d[0]-1].k : null;
  const joker = isY && sc.yahtzee != null && sc[upK] != null;
  let warn = '';
  if(isY && sc.yahtzee != null){
    if(sc[upK] == null && M.k !== upK) warn = `Regola del jolly: con uno Yahtzee di ${d[0]} si deve segnare prima nella casella “${UP[d[0]-1].label}”, che è ancora libera.`;
    else if(sc[upK] != null && c.face && LO.some(x => sc[x.k] == null)) warn = 'Regola del jolly: la casella superiore di questo numero è già usata, quindi si deve scegliere una casella libera della sezione inferiore.';
  }
  const bonus = isY && g.scores[M.pid].yahtzee === 50 && M.k !== 'yahtzee';
  return {score:diceScore(M.k, d, joker), bonus, joker, warn};
}

function renderScore(){
  const g = S.current, c = CAT[M.k], p = player(M.pid) || {name:'?',emoji:'❔',color:'#888'};
  const cur = g.scores[M.pid][M.k];
  const has = cur != null;
  const canExtra = M.k !== 'yahtzee' && g.scores[M.pid].yahtzee === 50;
  const extraBox = canExtra ? `<label class="extra"><input type="checkbox" data-act="extra" ${M.extra?'checked':''}> È un altro Yahtzee: aggiungi +100 di bonus</label>` : '';
  let body = '';

  if(M.mode === 'guided'){
    const opts = guidedOptions(c);
    body = extraBox + `<div class="opts ${(c.face||c.fixed)?'big':''}">${opts.map(v => {
      let sm = '';
      if(v === 0) sm = '<small>barra</small>';
      else if(c.face) sm = `<small>${v/c.face} ${v/c.face===1?'dado':'dadi'}</small>`;

    }).join('')}</div>`;
  } else if(M.mode === 'dice'){
    const info = diceInfo();
    body = `<div class="slots">${[0,1,2,3,4].map(i => M.dice[i] ? `<button class="slot full" data-act="undie" data-i="${i}" title="Togli">${die(M.dice[i],52)}</button>` : `<div class="slot"></div>`).join('')}</div>
      <div class="pad">${[1,2,3,4,5,6].map(n => `<button data-act="adddie" data-n="${n}" ${M.dice.length>=5?'disabled':''} aria-label="Dado ${n}">${die(n,42)}</button>`).join('')}</div>
      <div class="preview">${info ? `<div class="mini">Punti in “${c.label}”</div><div class="v">${info.score}</div>${info.bonus?'<div class="mini ok" style="margin-top:4px">+100 Bonus Yahtzee</div>':''}${info.joker?'<div class="mini" style="margin-top:4px">Jolly applicato</div>':''}`
                                 : `<div class="mini">Tocca i dadi usciti (${M.dice.length}/5) · tasti 1–6 da tastiera</div>`}</div>
      ${info && info.warn ? `<div class="warn">${info.warn}</div>` : ''}`;
  } else {
    body = extraBox + `<div class="manual"><input id="manual" type="number" inputmode="numeric" min="0" step="1" value="${has?cur:''}" placeholder="0"><button class="btn primary" data-act="manualok">Segna</button></div><div id="mwarn"></div>`;
  }

  const info = M.mode === 'dice' ? diceInfo() : null;
  dlg.innerHTML = `<div class="dlg-h">${av(p)}<div><div class="ttl">${esc(p.name)} · ${c.label}</div><div class="hh">${c.hint}${has?` · ora: <b>${cur}</b>`:''}</div></div></div>
    <div class="dlg-b">
      <div class="modes" role="group" aria-label="Modo di inserimento">
        <button data-act="mode" data-m="guided" aria-pressed="${M.mode==='guided'}">Scelta guidata</button>
        <button data-act="mode" data-m="dice" aria-pressed="${M.mode==='dice'}">Dadi</button>
        <button data-act="mode" data-m="manual" aria-pressed="${M.mode==='manual'}">Numero</button>
      </div>
      ${body}
    </div>
    <div class="dlg-f">
      ${has ? '<button class="btn danger left" data-act="clearcell">Svuota casella</button>' : ''}
      <button class="btn" data-act="close">Annulla</button>
      ${M.mode==='dice' ? `<button class="btn primary" data-act="dicedok" ${info?'':'disabled'}>Segna${info?' '+info.score:''}</button>` : ''}
    </div>`;

  const mi = document.getElementById('manual');
  if(mi){
    const check = () => {
      const v = mi.value === '' ? null : Number(mi.value);
      const w = document.getElementById('mwarn');
      if(v == null) w.innerHTML = '';
      else if(!Number.isInteger(v) || v < 0) w.innerHTML = '<div class="warn">Inserisci un numero intero da 0 in su.</div>';
      else if(!guidedOptions(c).includes(v)) w.innerHTML = `<div class="note">Valore insolito per “${c.label}”: controlla prima di segnare.</div>`;
      else w.innerHTML = '';
    };
    mi.addEventListener('input', check);
    mi.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); manualOk(); } });
    check();
  }
}

function commit(v, addBonus){
  const g = S.current;
  pushUndo();
  g.scores[M.pid][M.k] = v;

  save(); dlg.close(); render(); flashCell = null;
  toast(`${name}: ${v} in ${lab}${addBonus ? ' · +100 bonus!' : ''}`);

function manualOk(){
  const mi = document.getElementById('manual');

/* ---------- Aiuti a pagamento ---------- */
function usePower(kind){
  const g = S.current, r = g.roll, st = storyOf(g.story.pid), pw = POWERS[kind];
  if(st.coins < pw.cost){ toast('Non hai abbastanza monete'); return; }
  if(kind === 'extra'){
    if(r.extraUsed || r.n < (r.max || 3)) return;
    st.coins -= pw.cost; r.max = (r.max || 3) + 1; r.extraUsed = true;
    save(); render(); toast('🎲 Hai un lancio in più!');
  } else {
    if(r.fixUsed || !r.n) return;
    let pick = null;
    const draw = () => {
      dlg.innerHTML = `<div class="dlg-h"><div style="font-size:28px">✋</div><div><div class="ttl">Ritocco · 💰 ${pw.cost}</div><div class="hh">${pick == null ? 'Scegli il dado da cambiare' : 'Ora scegli la nuova faccia'}</div></div></div>
        <div class="dlg-b"><div class="slots">${r.dice.map((v,i) => `<button class="slot full" data-fix-die="${i}" style="${pick===i?'outline:3px solid var(--accent);outline-offset:2px;border-radius:12px':''}">${die(v,52)}</button>`).join('')}</div>
        ${pick != null ? `<div class="pad">${[1,2,3,4,5,6].map(n => `<button data-fix-face="${n}">${die(n,42)}</button>`).join('')}</div>` : ''}</div>
        <div class="dlg-f"><button class="btn" data-act="close">Annulla</button></div>`;
      dlg.querySelectorAll('[data-fix-die]').forEach(b => b.onclick = () => { pick = +b.dataset.fixDie; draw(); });
      dlg.querySelectorAll('[data-fix-face]').forEach(b => b.onclick = () => {
        st.coins -= pw.cost; r.dice[pick] = +b.dataset.fixFace; r.fixUsed = true; hint = null;
        dlg.close(); save(); render(); toast('✋ Dado ritoccato');
      });
    };
    draw(); if(!dlg.open) dlg.showModal();
  }
}

function miniRoll(){
  const r = S.mini.roll; if(r.n >= 3) return;
  spinIdx = [];
  r.dice = r.dice.map((v,i) => { if(r.n > 0 && r.held[i]) return v; spinIdx.push(i); return d6(); });
  if(r.n === 0) r.held = [false,false,false,false,false];
  r.n++; sndRoll(spinIdx.length); buzz(35);
  save(); render(); spinIdx = [];
}
function miniNext(){
  const mn = S.mini, m = MINIS[mn.idx];
  mn.turn++; mn.roll = freshRoll();
  if(mn.turn >= m.turns) return finishMini();
  save(); render();
}
function finishMini(){
  const mn = S.mini, m = MINIS[mn.idx], st = storyOf(mn.pid);
  if(!mn.practice){ st.coins += mn.coins; st.mini[m.id] = mn.coins; st.step = Math.max(st.step, mn.node + 1); }
  S.mini = null; save(); render();
  sndTone([523,659,784,1047], .11);

/* ===================== Statistiche ===================== */
function playerStats(){
  const st = {};
  S.games.filter(g => g.complete).forEach(g => g.results.forEach(r => {
    if(isAI(r.pid)) return;
    const s = st[r.pid] ||= {played:0, wins:0, sum:0, best:-Infinity, worst:Infinity, yahtzee:0, bonus:0, bestDate:null};
    s.played++; s.sum += r.total;
    if(g.winners.includes(r.pid) && g.results.length > 1) s.wins++;
    if(r.total > s.best){ s.best = r.total; s.bestDate = g.ended; }
    s.worst = Math.min(s.worst, r.total);
    s.yahtzee += (r.scores.yahtzee === 50 ? 1 : 0) + (r.yb || 0);
    if(r.bonus) s.bonus++;
  }));
  Object.values(st).forEach(s => s.avg = s.sum / s.played);
  return st;
}
function records(){
  let hi = null, lo = null;
  S.games.filter(g => g.complete).forEach(g => g.results.forEach(r => {
    if(isAI(r.pid)) return;
    if(!hi || r.total > hi.r.total) hi = {r, date:g.ended};
    if(!lo || r.total < lo.r.total) lo = {r, date:g.ended};
  }));
  return {hi, lo};
}
function liveP(r){ const p = player(r.pid); return p ? {...r, name:p.name, emoji:p.emoji, color:p.color} : r; }

/* ---------- Backup: con scelta della cartella dove il browser lo permette (Chrome, Edge) ---------- */
let lastHandle = null; // ultimo file usato: il selettore riparte da quella cartella
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('yahtzee', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k){ try{ const db = await idb(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); }catch(e){ return null; } }
async function idbSet(k, v){ try{ const db = await idb(); db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); }catch(e){} }
idbGet('handle').then(h => { if(h) lastHandle = h; });
async function withPicker(fn){
  // prova a ripartire dall'ultima cartella usata, altrimenti dal Desktop
  try{ return await fn(lastHandle || 'desktop'); }
  catch(e){ if(e.name === 'AbortError') throw e; if(lastHandle) return await fn('desktop'); throw e; }
}
async function exportData(){
  const now = Date.now();
  const json = JSON.stringify({...S, lastBackup:now}, null, 2);
  const name = `yahtzee-backup-${new Date(now).toISOString().slice(0,10)}.json`;
  const done = msg => { S.lastBackup = now; save(); render(); toast(msg); };
  if(window.showSaveFilePicker){
    try{
      const h = await withPicker(startIn => showSaveFilePicker({suggestedName:name, startIn, types:[{description:'Backup Yahtzee', accept:{'application/json':['.json']}}]}));
      const w = await h.createWritable(); await w.write(json); await w.close();
      lastHandle = h; idbSet('handle', h);
      return done('Backup salvato: ' + h.name);
    }catch(e){ if(e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], {type:'application/json'}));
  a.download = name;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  done('Backup scaricato nella cartella Download');
}
async function loadBackupText(text){
  try{
    const d = JSON.parse(text);
    if(!Array.isArray(d.players) || !Array.isArray(d.games)) throw 0;
    const v = await ask('Caricare il backup?', `Il file contiene ${d.players.length} giocatori e ${d.games.length} partite${d.current ? ' e una partita in corso' : ''}. <b>I dati attuali verranno sostituiti.</b>`, [{label:'Annulla', value:null}, {label:'Carica', value:true, kind:'primary'}]);
    if(!v) return;
    S = Object.assign(defaults(), d, {prefs:S.prefs, lastBackup:Date.now()});
    lastNow = undefined; hint = null; save(); render(); toast('Backup caricato');
  }catch(e){ toast('File non valido'); }
}
async function importData(){
  if(window.showOpenFilePicker){
    try{
      const [h] = await withPicker(startIn => showOpenFilePicker({startIn, types:[{description:'Backup Yahtzee', accept:{'application/json':['.json']}}]}));
      lastHandle = h; idbSet('handle', h);
      return loadBackupText(await (await h.getFile()).text());
    }catch(e){ if(e.name === 'AbortError') return; }
  }
  const inp = document.getElementById('impfile');
  inp.onchange = async () => { const f = inp.files[0]; inp.value = ''; if(f) loadBackupText(await f.text()); };
  inp.click();
}

    case 'pick': { const i = pickSel.indexOf(d.p); i >= 0 ? pickSel.splice(i,1) : pickSel.push(d.p); render(); break; }
    case 'pickall': pickSel = pickSel.length === S.players.length ? [] : [...pickSel, ...S.players.map(p => p.id).filter(id => !pickSel.includes(id))]; render(); break;
    case 'shuffle': for(let i = pickSel.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [pickSel[i], pickSel[j]] = [pickSel[j], pickSel[i]]; } render(); toast('Primo a giocare: ' + player(pickSel[0]).name); break;
    case 'start': startGame(); break;
    case 'newmode': newMode = d.m; render(); break;
    case 'hero': S.storyHero = d.p; save(); render(); break;
    case 'node': openNode(Number(d.i)); break;
    case 'storystart': if(S.current){ dlg.close(); toast('Prima finisci la partita in corso'); } else startStory(Number(d.i)); break;
    case 'storynext': dlg.close(); tab = 'story'; render(); openNode(Number(d.i)); break;
    case 'gostory': dlg.close(); tab = 'story'; render(); window.scrollTo(0,0); break;
    case 'aifast': S.prefs.aiFast = !S.prefs.aiFast; save(); render(); break;
    case 'power': usePower(d.p); break;
    case 'ministart': startMini(Number(d.i)); break;
    case 'mroll': miniRoll(); break;
    case 'mhold': { const r = S.mini.roll; if(r.n > 0 && r.n < 3){ r.held[+d.i] = !r.held[+d.i]; save(); render(); } break; }
    case 'mclaim': { const mn = S.mini, gl = MINIS[mn.idx].goals[+d.g]; if(mn.claimed[d.g] == null && mn.roll.n && gl.test(mn.roll.dice)){ mn.claimed[d.g] = gl.coins; mn.coins += gl.coins; sndTone([880,1175], .08); toast(`+💰 ${gl.coins} · ${gl.label}`); miniNext(); } break; }
    case 'mpass': miniNext(); break;
    case 'mquit': (async () => { const v = await ask('Uscire dal minigioco?', 'Le monete raccolte in questa partita andranno perse.', [{label:'Continua', value:null}, {label:'Esci', value:true, kind:'danger solid'}]); if(v){ S.mini = null; save(); render(); } })(); break;
    case 'again': { const last = S.games.find(x => !x.story); pickSel = last.results.map(r => r.pid).filter(id => player(id)); if(pickSel.length) startGame(!!last.virtual); break; }
    case 'settings': openSettings(); break;
    case 'pref': setPref(el); break;
    case 'theme': S.prefs.theme = d.v; save(); applyPrefs(); openSettings(); break;
    case 'cmp': cmpPid = d.p; render(); break;
    case 'labhint': if(mqPhone.matches) toast(CAT[d.k].label + ': ' + CAT[d.k].hint); break;
    case 'hint': askHint(); break;
    case 'applyhint': applyHint(); break;
    case 'roll': rollDice(); break;
    case 'hold': toggleHold(Number(d.i)); break;
    case 'cell': {
      const g = S.current;
      if(!g.virtual){ openScore(d.p, d.k); break; }
      const now = nowPlayer(g);
      if(isAI(now)) toast(`Aspetta: sta giocando ${(player(now)||{}).name}`);
      else if(g.scores[d.p][d.k] != null) toast(g.story ? 'Casella già usata' : 'Casella già usata (per correggere usa “Annulla”)');
      else if(d.p !== now) toast(`È il turno di ${(player(now)||{}).name}`);
      else if(!g.roll.n) toast('Prima lancia i dadi');
      else scoreVirtual(d.p, d.k);
      break;
    }
    case 'yb': openYB(d.p); break;
    case 'ybp': case 'ybm': { pushUndo(); const g = S.current; g.yb[d.p] = Math.max(0, (g.yb[d.p]||0) + (a === 'ybp' ? 1 : -1)); save(); render(); openYB(d.p); break; }
    case 'undo': undo(); break;
    case 'end': endGame(); break;
    case 'close': dlg.close(); break;
    case 'mode': M.mode = d.m; S.prefs.mode = d.m; save(); renderScore(); focusManual(); break;
    case 'extra': M.extra = el.checked; break;
    case 'pickv': commit(Number(d.v), M.extra); break;
    case 'adddie': if(M.dice.length < 5){ M.dice.push(Number(d.n)); renderScore(); } break;
    case 'undie': M.dice.splice(Number(d.i), 1); renderScore(); break;
    case 'dicedok': { const info = diceInfo(); if(info) commit(info.score, info.bonus); break; }
    case 'manualok': manualOk(); break;
    case 'clearcell': { pushUndo(); delete S.current.scores[M.pid][M.k]; save(); dlg.close(); render(); toast('Casella svuotata'); break; }
    case 'rematch': { const g = S.games.find(x => x.id === d.g); pickSel = g.results.map(r => r.pid).filter(id => player(id)); dlg.close(); tab = 'game'; if(pickSel.length) startGame(!!g.virtual); else render(); break; }
    case 'femoji': form.emoji = d.v; render(); break;
    case 'fcolor': form.color = d.v; render(); break;
    case 'pedit': { const p = player(d.p); editId = p.id; form = {name:p.name, nick:p.nick||'', emoji:p.emoji, color:p.color}; render(); window.scrollTo(0,0); break; }
    case 'fcancel': editId = null; form = blankForm(); render(); break;
    case 'pdel': deletePlayer(d.p); break;
    case 'hview': showGameSheets(d.g); break;
    case 'hdel': (async () => { const v = await ask('Eliminare la partita?', 'La partita verrà tolta dallo storico, dai record e dalle statistiche.', [{label:'Annulla', value:null}, {label:'Elimina', value:true, kind:'danger solid'}]); if(v){ S.games = S.games.filter(g => g.id !== d.g); save(); render(); toast('Partita eliminata'); } })(); break;
    case 'export': exportData(); break;
    case 'import': importData(); break;
  }
});
document.addEventListener('toggle', e => { if(e.target.id === 'gstats') statsOpen = e.target.open; }, true);
// telefono: trascinando la cartella a destra/sinistra si cambia l'avversario mostrato
let tStart = null;
document.addEventListener('touchstart', e => {
  tStart = mqPhone.matches && e.target.closest('.sheet-wrap') ? {x:e.touches[0].clientX, y:e.touches[0].clientY} : null;
}, {passive:true});
document.addEventListener('touchend', e => {
  if(!tStart) return;
  const t = e.changedTouches[0], dx = t.clientX - tStart.x, dy = t.clientY - tStart.y;
  tStart = null;
  const g = S.current;
  if(Math.abs(dx) < 60 || Math.abs(dy) > 45 || !g || g.playerIds.length < 3) return;
  const main = nowPlayer(g) || g.playerIds[0], others = g.playerIds.filter(id => id !== main);
  const i = others.indexOf(cmpPid), dir = dx < 0 ? 1 : -1;
  cmpPid = others[((i < 0 ? 0 : i + dir) + others.length) % others.length];
  render();
}, {passive:true});
document.addEventListener('keydown', e => {
  if(!dlg.open && e.key === ' ' && !/INPUT|TEXTAREA|BUTTON/.test(document.activeElement.tagName)){
    if(tab === 'game' && S.current && S.current.virtual){ e.preventDefault(); rollDice(); return; }
    if(tab === 'story' && S.mini){ e.preventDefault(); miniRoll(); return; }
  }
  if(M && M.mode === 'dice' && dlg.open){
    if(/^[1-6]$/.test(e.key) && M.dice.length < 5){ M.dice.push(Number(e.key)); renderScore(); }
    else if(e.key === 'Backspace' && M.dice.length){ M.dice.pop(); renderScore(); }
    else if(e.key === 'Enter'){ const info = diceInfo(); if(info){ e.preventDefault(); commit(info.score, info.bonus); } }
  }
});

document.getElementById('logo').innerHTML = die(5, 26);
applyPrefs();
render();
</script>
